<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup | LIVIT</title>

    <link
        rel="stylesheet"
        href="../styles/signup.css"
    >

</head>

<body>

    <main>

        <div class="header">
            Create Your Account

            <p>
                Join LIVIT and find your perfect stay
            </p>
        </div>


        <form>

            <div class="field">

                <label for="name">
                    NAME
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Enter your full name"
                >

            </div>


            <div class="field">

                <label for="username">
                    USERNAME
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter username"
                >

            </div>


            <div class="field">

                <label for="email">
                    EMAIL
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                >

            </div>


            <div class="field">

                <label for="phone">
                    PHONE NUMBER
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="Enter phone number"
                >

            </div>


            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                >

            </div>


            <div class="field">

                <label for="confirm-password">
                    RE-ENTER PASSWORD
                </label>

                <input
                    id="confirm-password"
                    type="password"
                    placeholder="Confirm your password"
                >

            </div>


            <a
                href="./home.html"
                class="create-account"
            >
                Create Account
            </a>

        </form>

    </main>


    <footer>
        &copy; LIVIT
    </footer>

</body>

</html>
