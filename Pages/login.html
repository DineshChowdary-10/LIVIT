<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | LIVIT</title>

    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

    <header>
        <h1 class="note">Welcome to LIVIT</h1>
        <p>Sign in to continue</p>
    </header>


    <main>

        <div class="main">

            <!-- ROTATING LOGO - KEEPING YOUR IDEA -->
           

                <div class="logos">
       <div><img src="../assessts/livit_logo.png" alt="" class="logo1" /></div>
       <div><img src="../assessts/livit_logo.png" alt="" class="logo2" /></div>
       </div>



            <div class="form signin">

                <form action="">

                    <div class="input-group">

                        <p class="option">EMAIL</p>

                        <input
                            type="email"
                            placeholder="Enter your email"
                        >

                    </div>


                    <div class="input-group">

                        <p class="option">PASSWORD</p>

                        <input
                            type="password"
                            placeholder="Enter your password"
                        >

                    </div>


                    <a href="home.html" class="login">
                        Sign In
                    </a>

                </form>


                <a href="#" class="forgot">
                    Forgot Password?
                </a>


                <p class="account">
                    Don't have an account?
                </p>


                <a href="./signup.html" class="signup">
                    Sign Up Now
                </a>

            </div>

        </div>

    </main>


    <footer>
        &copy; LIVIT
    </footer>

</body>

</html>
